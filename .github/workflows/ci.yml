name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  film:
    # first-run test on every OS: install, doctor, voice, stills, a draft render, check, package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (ffmpeg; graphics library on Linux)
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libegl1 libgl1 ;;
            macOS)   brew install ffmpeg ;;
            Windows)
              # Chocolatey's server is sometimes down (503): retry, then fall back to the LGPL build on GitHub
              for i in 1 2 3; do choco install ffmpeg -y --no-progress && break || sleep 15; done
              if ! command -v ffmpeg >/dev/null; then
                curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
                unzip -q ff.zip -d "$RUNNER_TEMP/ff"
                bin=$(dirname "$(find "$RUNNER_TEMP/ff" -name ffmpeg.exe | head -1)")
                echo "$bin" >> "$GITHUB_PATH"
                export PATH="$bin:$PATH"
              fi ;;
          esac
          ffmpeg -version | head -1
      - name: First run (timed)
        timeout-minutes: 20
        env:
          PYTHONUTF8: "1"
          DOCUFRAME_TOOL_TIMEOUT: "180"
          DOCUFRAME_HANG_DUMP: "900"
        run: |
          start=$(date +%s)
          pip install -e ".[voice]"
          docuframe doctor
          mkdir -p "work dir/فیلم"
          cp -r skills/docuframe/templates/history-short "work dir/فیلم/first"
          python tools/placeholder_photos.py "work dir/فیلم/first"
          docuframe make --project "work dir/فیلم/first" --yes --draft
          end=$(date +%s)
          echo "FIRST_RUN_SECONDS=$((end-start))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resume after a forced stop
        run: |
          cd "work dir/فیلم"
          rm -rf first/out/chunks
          python ../../tools/interrupt_render.py first --draft --chunk 2 --workers 1
          docuframe render --project first --draft --chunk 2 --workers 1 | tee resume.log
          grep -Eq "[1-9][0-9]* already done" resume.log
      - name: Right-to-left and Indic fixtures
        run: |
          for f in fa-rtl hi-vertical; do
            cp -r "evals/fixtures/$f" "work dir/$f"
            python tools/placeholder_photos.py "work dir/$f" || true
            docuframe voice --project "work dir/$f"
            docuframe narration --project "work dir/$f"
            docuframe assets --project "work dir/$f" || true
            docuframe check --project "work dir/$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stills-${{ matrix.os }}
          path: |
            work dir/**/out/stills/*.jpg
            work dir/**/out/check.md
            work dir/**/out/youtube/description.txt
